name: Desktop

# Builds the installers (M9). Heavy: whisper.cpp, Tauri, and a ~350 MB payload, so it runs on version
# tags and by hand rather than on every push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  installer:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            sidecars/pty
            sidecars/voce
            desktop/src-tauri

      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install
        run: npm ci

      - name: Prepare bundle
        run: node desktop/scripts/prepare.mjs

      - name: Desktop crate lint and tests
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

      - name: Build installer
        working-directory: desktop
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: loom-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/nsis/*.exe
