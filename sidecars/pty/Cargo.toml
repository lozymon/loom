[package]
name = "loom-pty"
version = "0.1.0"
edition = "2021"
description = "Loom PTY sidecar: runs terminal sessions for the hub over a JSON-lines protocol"
license = "MIT"
publish = false

# Standalone crate: not part of any Cargo workspace (ADR-0002).
[workspace]

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
